# Hold a checkout of Meteora's DBC SDK to mainnet, in CI, without keeping the data in the SDK's repository.
#
#   - uses: actions/checkout@v4
#   - uses: essej72/tapedeck@main
#     with:
#       sdk-path: packages/dynamic-bonding-curve
#
# Two offline checks, both failing the job on any mismatch:
#   history      every recorded swap of the corpus, replayed through the checkout's quote math from pool creation
#   simulations  swaps nobody makes on mainnet (exact-out), as the live program answered them when it was asked
# The data comes from this repository's releases. Nothing is sent to a network apart from that download.
name: Tapedeck DBC conformance
description: Replay mainnet swap history and simulated swaps through a checkout of Meteora's DBC SDK; fail on any mismatch.
inputs:
  sdk-path:
    description: The SDK package (the folder that holds src/), relative to the workspace.
    required: true
  release:
    description: Tag of the tapedeck release that holds the data, or "latest".
    required: false
    default: latest
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Fetch the corpus and the simulations
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        mkdir -p data
        base="https://github.com/essej72/tapedeck/releases"
        if [ "$RELEASE" = "latest" ]; then from="$base/latest/download"; else from="$base/download/$RELEASE"; fi
        curl -sSfL -o data/corpus.jsonl.gz "$from/corpus.jsonl.gz"
        curl -sSfL -o data/probes.jsonl.gz "$from/probes.jsonl.gz"
    - name: Bundle the checkout's swap math
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SDK_PATH: ${{ inputs.sdk-path }}
      run: node scripts/bundle-sdk-math.mjs "$GITHUB_WORKSPACE/$SDK_PATH" data/sdk-math.mjs
    - name: History
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node src/conformance.ts rerun --corpus data/corpus.jsonl.gz --math data/sdk-math.mjs
    - name: Simulations
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node src/probe.ts check --file data/probes.jsonl.gz --math data/sdk-math.mjs
